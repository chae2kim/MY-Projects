<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="자리에서 슬쩍 일어나, 말없이 같이 앉아 있다 가는 온라인 해우소.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<title>해우소</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a full-bleed 3D stage (third-person camera behind your chibi) with overlays — top HUD, joystick bottom-left, context action bottom-center, whisper bar at the very bottom. Office is cold fluorescent; 해우소 is warm night-temple wood. */
:root{
  --wall:#1b231f; --grout:#28332d; --door-edge:#5c452e;
  --paper:#efe6d3; --muted:#9ca89f; --faint:#5f6b63; --ink:#1b231f;
  --lantern:#d0503f; --jade:#86b39a; --gold:#d8b46a; --glass:#121815e0;
  --f-display:"Nanum Myeongjo","Batang",serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--wall);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow:hidden}
.app{position:relative;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.plaque{flex:none;white-space:nowrap;background:var(--door-edge);border:2px solid var(--gold);padding:1px 12px 3px;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.16em;color:var(--gold);line-height:1.3}
.live{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px 12px;font-size:12px;color:var(--muted)}
.live span{display:flex;align-items:center;gap:5px}
.live b{font-family:var(--f-mono);font-weight:500;color:var(--paper)}
.live .all{color:var(--ink);background:var(--gold);padding:0 8px;border-radius:9px;font-size:13px}
.live .all b{color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.d-desk{background:#8fd0bf} .d-walk{background:var(--gold)} .d-stall{background:var(--lantern)}

.stage{position:relative;flex:1;min-height:420px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tagl{position:absolute;transform:translate(-50%,-100%);font-size:11px;padding:0 7px;border-radius:9px;white-space:nowrap;background:#ffffffd9;color:var(--ink)}
.tagl.me{background:var(--gold)}
.bub{position:absolute;transform:translate(-50%,-100%);max-width:200px;padding:5px 10px;background:#fff;color:var(--ink);font-size:13px;line-height:1.4;border-radius:4px;box-shadow:0 2px 0 #0003;text-align:center;text-wrap:balance}
.bub::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff}
.bub.boss{background:#ffe9e5}
.bub.boss::after{border-top-color:#ffe9e5}

.hud{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:10px;font-family:var(--f-mono);font-size:11px;background:#000a;padding:3px 9px;color:var(--paper)}
.sus-hud{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:10px;display:flex;align-items:center;gap:6px;font-size:11px;background:#000a;padding:4px 9px}
.sus-hud .bar{width:70px;height:6px;background:#ffffff22}
.sus-hud .fill{height:100%;background:var(--lantern);width:0;transition:width .4s}

.joy{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:76px;width:118px;height:118px;border-radius:50%;background:#0006;border:2px solid #ffffff33;touch-action:none}
.joy .knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#efe6d3cc}
.keys{position:absolute;left:150px;bottom:88px;font-size:12px;color:#fffc;background:#0007;padding:3px 9px}
@media (max-width:560px){.keys{display:none}}
.action{position:absolute;left:50%;transform:translateX(-50%);bottom:92px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 300px)}
@media (max-width:560px){.action{left:auto;right:max(14px,env(safe-area-inset-right,0px));transform:none;max-width:52%;justify-content:flex-end}}

.btn{font:inherit;font-size:15px;padding:11px 18px;border-radius:3px;cursor:pointer;border:1px solid var(--faint);background:#121815d9;color:var(--paper)}
.btn.primary{background:var(--lantern);border-color:var(--lantern);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.alert{background:var(--gold);border-color:var(--gold);color:var(--ink);animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.04)}}
.btn[disabled]{opacity:.4;cursor:default}
.btn:focus-visible,.chip:focus-visible,.whisper input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.whisper{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:linear-gradient(transparent,#000c 40%)}
.whisper input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:3px;border:1px solid #ffffff33;background:#000a;color:var(--paper)}
.whisper .btn{padding:10px 14px;font-size:14px;white-space:nowrap}

.card{position:absolute;left:50%;transform:translateX(-50%);bottom:72px;width:min(520px,calc(100% - 28px));background:var(--glass);border:1px solid var(--grout);padding:16px 18px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(6px)}
.card h2{margin:0;font-family:var(--f-display);font-size:18px;font-weight:700;text-wrap:balance}
.label{font-size:12px;color:var(--muted);letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--faint);background:transparent;color:var(--paper);font:inherit;font-size:13px;cursor:pointer;border-radius:2px}
.chip[aria-pressed="true"]{border-color:var(--gold);background:#d8b46a24}
.shoe{width:16px;height:9px;border-radius:9px 9px 2px 2px;background:var(--c,#333);display:inline-block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.log{font-size:13px;color:var(--muted)} .log b{color:var(--paper);font-family:var(--f-mono);font-weight:500}
.clock{font-family:var(--f-mono);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gauge .bar{height:7px;background:#ffffff14;margin-top:5px}
.gauge .fill{height:100%;width:0;transition:width .8s linear}
.g-calm .fill{background:var(--jade)} .g-sus .fill{background:var(--lantern)}
.event{padding:8px 12px;border-left:3px solid var(--gold);background:#ffffff0a;font-size:14px;min-height:2.8em}
.wisdom{font-family:var(--f-display);font-size:16px;color:var(--gold);text-wrap:balance}
.card.folded .gauges,.card.folded .event,.card.folded .wisdom{display:none}
.toast{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:7px 14px;font-size:14px;z-index:6;max-width:calc(100% - 32px);text-align:center}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);color:var(--gold);font-size:18px;background:var(--wall)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="plaque">解憂所</div>
    <div class="live">
      <span class="all">지금 <b id="n-all">1</b>명 출근</span>
      <span><i class="dot d-desk"></i>자리 <b id="n-desk">1</b></span>
      <span><i class="dot d-walk"></i>이동 <b id="n-walk">0</b></span>
      <span><i class="dot d-stall"></i>해우소 <b id="n-stall">0</b></span>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="labels" id="labels"></div>
    <div class="hud" id="hud">3F · 품질팀</div>
    <div class="sus-hud"><span>팀장 의심도</span><div class="bar"><div class="fill" id="sus-top"></div></div></div>

    <div class="joy" id="joy" hidden><div class="knob" id="knob"></div></div>
    <div class="keys" id="keys" hidden>WASD · 방향키로 걷기 · 드래그로 둘러보기 · 옥상에선 B로 비눗방울</div>
    <div class="action" id="action"></div>

    <!-- 자리에 앉아 있을 때 -->
    <section class="card" id="c-desk">
      <h2 id="desk-h">모니터를 보는 척한 지 47분째.</h2>
      <div class="label">오늘 신고 온 신발</div>
      <div class="chips" id="shoes"></div>
      <div class="row"><button class="btn primary" id="stand">슬쩍 일어나기</button></div>
      <div class="log" id="log"></div>
    </section>

    <!-- 칸 안 -->
    <section class="card" id="c-stall" hidden>
      <div class="wisdom" id="wisdom"></div>
      <div class="row" style="justify-content:space-between"><div class="clock" id="clock">00:00</div><button class="btn" id="fold" type="button" style="padding:6px 12px;font-size:13px">접기</button></div>
      <div class="gauges">
        <div class="gauge g-calm"><div class="label">근심 해소</div><div class="bar"><div class="fill" id="calm"></div></div></div>
        <div class="gauge g-sus"><div class="label">팀장 의심도</div><div class="bar"><div class="fill" id="sus"></div></div></div>
      </div>
      <div class="event" id="event"></div>
      <div class="row">
        <button class="btn" id="hold" disabled>숨 죽이기</button>
        <button class="btn" id="sigh">한숨 쉬기</button>
        <button class="btn" id="tissue">옆 칸에 휴지</button>
        <button class="btn" id="fan" aria-pressed="false">환풍기 소리</button>
        <button class="btn primary" id="out">문 열고 나가기</button>
      </div>
    </section>

    <form class="whisper" id="whisper">
      <input id="say" maxlength="30" placeholder="혼잣말 (30자)" autocomplete="off">
      <button class="btn" type="submit">말하기</button>
    </form>
    <div class="toast" id="toast" hidden></div>
    <div class="loading" id="loading">법당… 아니 사무실 여는 중</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const SHOES={loafer:{n:"구두",c:"#2a201b"},sneaker:{n:"운동화",c:"#e6e1d6"},slipper:{n:"사무실 슬리퍼",c:"#3f6aa3"},heel:{n:"힐",c:"#8e2f2c"},clog:{n:"크록스",c:"#6aa255"}};
const SHIRTS=["#eef0f2","#c9dcef","#f2e3c9","#d9e8d2","#e8d0d6","#d6d3ec"];
const WISDOM=["근심은 물과 같아서, 흘려보내면 가벼워진다.","메일함은 기다려 준다. 너는 지금 여기 앉아 있다.","잠시 문을 잠그는 것도 수행이다.","알림은 무상(無常)하다. 오고, 또 간다.","오늘의 회의도 결국 지나간다.","숨을 들이쉬고, 결재를 내려놓아라.","급한 일은 많아도, 지금 할 일은 하나다."];
const EVENTS=["누군가 손 씻는 소리가 들린다.","옆 칸에서 통화 중… “네, 바로 자리로 갈게요.”","환풍기가 덜컹 하더니 다시 돈다.","메신저 알림 1개. 못 본 걸로 한다.","누군가 거울 앞에서 한숨을 쉰다. 동지다.","핸드드라이어가 우렁차게 운다."];
const DESK_LINES=["모니터를 보는 척한 지 47분째.","엑셀 셀 하나를 12분째 노려보는 중.","회의 끝나고 아무도 말을 안 건다. 지금이다.","‘확인 부탁드립니다’ 메일이 세 통째 쌓였다.","오후 3시. 몸이 해우소를 부른다."];
const NPC_LINES=["아 이거 누가 결재했어…","점심 뭐 먹지","오늘 회식 있대요?","메일 확인 부탁드립니다~","(타닥타닥)","커피 한 잔 하실 분","시험성적서 아직이에요?","아 엑셀 또 멈췄네"];
const ZONE_LINES={office:["파티션 사이를 조용히 지나간다.","아무도 쳐다보지 않는다. 지금이다."],pantry:["탕비실 도착. 커피 향이 부른다.","과자 바구니가 채워져 있다. 오늘 운이 좋다."],hall:["복도. 여기서부터는 자유다.","엘리베이터 앞. 아는 사람 없음. 좋아."],wc:["해우소 현판이 보인다. 근심아 기다려라.","향 냄새… 아니 방향제 냄새."],roof:["바람이 분다. 메일이 멀어진다.","하늘이 넓다. 결재판은 좁다.","옥상 공기는 공짜다."]};
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function mmss(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}

/* ================= world layout (meters, y up, office faces -z) ================= */
const COLS=[-7,-5,2,4,6.2], ROWS=[2,-2,-6];
const DESKS=[]; ROWS.forEach((z,r)=>COLS.forEach((x,c)=>DESKS.push({x,z,r,c})));
const NPC_DESKS=[0,3,4,5,7,9,11,13];
const PREF=[1,2,6,8,10,12,14];
const STALLS=[-5.6,-2.8,0,2.8,5.6];
const STALL_FRONT=-37.6, STALL_BACK=-40.4;
const NPC_STALL=4;
const BOSS={x:6.3,z:-11.6};
const ROOF_DOOR_Z=-26;
const ROOF={x0:30,x1:46,z0:-6,z1:-22};

let THREEOK=!!window.THREE;
const scene=THREEOK?new THREE.Scene():null;
let renderer,camera;
const colliders=[]; const camBlockers=[];
const lamps=[];

function mat(c,o={}){return new THREE.MeshLambertMaterial(Object.assign({color:c},o))}
function box(w,h,d,m,x,y,z,opt={}){const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);me.position.set(x,y,z);scene.add(me);
  if(opt.col!==false&&opt.col) colliders.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2});
  if(opt.block) camBlockers.push(me); return me}
function wall(x0,z0,x1,z1,h,m){const w=Math.max(.15,Math.abs(x1-x0)),d=Math.max(.15,Math.abs(z1-z0));return box(w,h,d,m,(x0+x1)/2,h/2,(z0+z1)/2,{col:true,block:true})}
function texCanvas(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
function sign(text,w,h,bg,fg,font,x,y,z,ry=0,pw=1.6,ph=.5){
  const t=texCanvas(w,h,(g,W,H)=>{g.fillStyle=bg;g.fillRect(0,0,W,H);g.fillStyle=fg;g.font=font;g.textAlign="center";g.textBaseline="middle";g.fillText(text,W/2,H/2+2)});
  const m=new THREE.Mesh(new THREE.PlaneGeometry(pw,ph),new THREE.MeshBasicMaterial({map:t}));m.position.set(x,y,z);m.rotation.y=ry;scene.add(m);return m}

function buildWorld(){
  scene.background=new THREE.Color("#1b231f");
  scene.fog=new THREE.Fog("#1b231f",26,60);
  scene.add(new THREE.HemisphereLight(0xf2f6ff,0x4a4e48,.75));
  const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(6,14,8);scene.add(sun);

  /* floors */
  const carpet=texCanvas(128,128,(g)=>{g.fillStyle="#7f8a8c";g.fillRect(0,0,128,128);g.fillStyle="#76807f";g.fillRect(0,0,64,64);g.fillRect(64,64,64,64);g.strokeStyle="#00000018";g.strokeRect(0,0,128,128)});
  carpet.wrapS=carpet.wrapT=THREE.RepeatWrapping;carpet.repeat.set(9,9);
  const of=new THREE.Mesh(new THREE.PlaneGeometry(18,18),mat("#fff",{map:carpet}));of.rotation.x=-Math.PI/2;of.position.set(0,0,-5);scene.add(of);
  const hf=new THREE.Mesh(new THREE.PlaneGeometry(4,16),mat("#9d998f"));hf.rotation.x=-Math.PI/2;hf.position.set(-1,0,-22);scene.add(hf);
  const wood=texCanvas(256,256,(g)=>{for(let i=0;i<8;i++){g.fillStyle=i%2?"#4a3626":"#553f2c";g.fillRect(0,i*32,256,32);g.fillStyle="#0002";g.fillRect(0,i*32+30,256,2)}});
  wood.wrapS=wood.wrapT=THREE.RepeatWrapping;wood.repeat.set(4,3);
  const wf=new THREE.Mesh(new THREE.PlaneGeometry(16,11),mat("#fff",{map:wood}));wf.rotation.x=-Math.PI/2;wf.position.set(0,.001,-35.5);scene.add(wf);

  /* office walls */
  const ow=mat("#d3d8d5"), H=3;
  wall(-9,4,9,4,H,ow); wall(-9,4,-9,-14,H,ow); wall(9,4,9,-14,H,ow);
  wall(-9,-14,-2.6,-14,H,ow); wall(-.4,-14,9,-14,H,ow); box(2.2,.6,.15,ow,-1.5,2.7,-14);
  sign("EXIT",128,48,"#3fae6a","#fff","bold 30px sans-serif",-1.5,2.68,-13.9,0,.7,.26);
  {const lm=new THREE.MeshBasicMaterial({color:"#f7fffb"});for(let z=2;z>-14;z-=4) for(const x of [-5,1,6]){const l=new THREE.Mesh(new THREE.PlaneGeometry(2.2,.5),lm);l.rotation.x=Math.PI/2;l.position.set(x,2.98,z);scene.add(l)}}
  /* desks */
  const deskM=mat("#cfc7b8"), partM=mat("#66737a"), trimM=mat("#3c4549"), chairM=mat("#2b2f33");
  DESKS.forEach((d,i)=>{
    box(1.6,.06,.8,deskM,d.x,.75,d.z);
    box(1.6,.72,.05,deskM,d.x,.37,d.z-.38);
    const p=box(1.7,1.3,.07,partM,d.x,.65,d.z-.45);
    box(1.7,.05,.1,trimM,d.x,1.32,d.z-.45);
    box(.07,1.3,.85,partM,d.x-.85,.65,d.z-.05); box(.07,1.3,.85,partM,d.x+.85,.65,d.z-.05);
    colliders.push({x0:d.x-.9,x1:d.x+.9,z0:d.z-.5,z1:d.z+.4});
    const scr=new THREE.MeshBasicMaterial({color:"#8fd0bf"});
    box(.62,.4,.04,mat("#111"),d.x,1.05,d.z-.22); const s=box(.56,.34,.01,scr,d.x,1.05,d.z-.195); d.screen=s;
    box(.06,.2,.06,mat("#111"),d.x,.87,d.z-.24);
    box(.5,.08,.5,chairM,d.x,.46,d.z+.7); box(.5,.55,.07,chairM,d.x,.78,d.z+.97); box(.08,.42,.08,chairM,d.x,.22,d.z+.7);
    if(Math.random()<.6){const n=box(.14,.14,.005,mat("#f2dc73"),d.x+.5,1.12,d.z-.41)}
  });
  /* boss room */

  for(const s of [-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.035,8,6),mat("#1b1714"));e.position.set(.12*s,-.02,.34);head.add(e)}
  const shadow=new THREE.Mesh(new THREE.CircleGeometry(.36,20),new THREE.MeshBasicMaterial({color:"#000",transparent:true,opacity:.22}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.012;g.add(shadow);

function pose(c,mode,t,dt){
  c.phase+=dt*(mode==="walk"?11:0);
  const sw=mode==="walk"?Math.sin(c.phase)*.65:0;
  if(mode==="sit"){c.legs.forEach(l=>l.rotation.x=-1.45);c.g.children[0].position.y=.62;c.arms.forEach((a,i)=>a.rotation.x=-.9+Math.sin(t*14+i*2)*.06)}
  else{c.legs[0].rotation.x=sw;c.legs[1].rotation.x=-sw;c.arms[0].rotation.x=-sw*.8;c.arms[1].rotation.x=sw*.8}
  c.head.position.y=1.17+(mode==="walk"?Math.abs(Math.cos(c.phase))*.05:Math.sin(t*1.6+c.phase)*.01);
  c.body.position.y=.62+(mode==="walk"?Math.abs(Math.cos(c.phase))*.03:0);
}

function syncPeers(){

  const seen=new Set();

    if(p.kind!=="viewer"||p.sameTab) continue;
    const q=p.presence||{}; if(typeof q.x!=="number") continue;
    seen.add(p.peer);
    let o=peers[p.peer];
    if(!o){o=peers[p.peer]={c:chibi({shirt:SHIRTS.includes(q.shirt)?q.shirt:"#eef0f2",shoe:(SHOES[q.shoe]||SHOES.loafer).c}),x:q.x,z:q.z,h:q.h||0,lastMove:0};o.c.g.position.set(q.x,0,q.z)}
    o.q=q; o.where=["desk","walk","stall"].includes(q.where)?q.where:"desk";
    o.c.shoeM.color.set((SHOES[q.shoe]||SHOES.loafer).c);
    const hk=q.hold==="mix"||q.hold==="americano"?q.hold:null; if(hk!==o.hold){o.hold=hk;setHold(o.c,hk)}

  updateCounts(); refreshStalls();

function stallOccupant(i){

let lastT=performance.now(), npcNext=performance.now()+4000;
function zoneOf(x,z){if(x>25)return "roof";if(z>-14)return x<-6.5&&z<-8.5?"pantry":"office";if(z>-30)return "hall";return "wc"}
function frame(t){
  const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  // move
  if(me.where==="walk"){
    let ix=input.x,iy=input.y;
    if(keys.w||keys.arrowup)iy=-1; if(keys.s||keys.arrowdown)iy=1; if(keys.a||keys.arrowleft)ix=-1; if(keys.d||keys.arrowright)ix=1;

      if(!blocked(me.x,me.z+mz*sp))me.z+=mz*sp;
      const th=Math.atan2(mx,mz); me.h+=angDiff(th,me.h)*Math.min(1,dt*12);
      const ad=angDiff(me.h,camYaw); if(Math.abs(ad)<2.3) camYaw+=ad*Math.min(1,dt*1.6);

    } else me.moving=false;
    if(t-lastSay>140&&(me.moving||standingAnim)){lastSay=t;presence({x:+me.x.toFixed(2),z:+me.z.toFixed(2),h:+me.h.toFixed(2)})}
    const zn=zoneOf(me.x,me.z); if(zn!==zone){if(zone)speak("me",pick(ZONE_LINES[zn]),2800);zone=zn;$("hud").textContent={office:"3F · 품질팀",pantry:"3F · 탕비실",hall:"3F · 복도",wc:"解憂所",roof:"옥상"}[zn];setSky(zn==="roof")}
    // context actions
    const seat=deskSeat(me.desk);
    if(me.x>25){
      if(Math.hypot(me.x-(ROOF.x0+3.3),me.z-(ROOF.z0+ROOF.z1)/2)<1.3) setAction("down",[["3층으로 내려가기","primary",goDown],["비눗방울 불기","gold",null,true]]);
      else setAction("roof"+(me.hold?sips:""),[["비눗방울 불기","gold",null,true],...(me.hold?[["한 모금","",sip]]:[])]);
    } else if(me.x<-6.3&&me.z<-8.9&&me.z>-12.7){const [k,b]=pantryBtns();setAction(k,b)}
    else if(me.x<-2&&Math.abs(me.z-ROOF_DOOR_Z)<1.1) setAction("up",[["옥상으로 올라가기","primary",goUp]]);
    else if(Math.hypot(me.x-seat.x,me.z-(seat.z+.4))<1.1) setAction("sit",[["자리에 앉기","primary",sitAtDesk]]);
    else{
      let near=-1; STALLS.forEach((s,i)=>{if(Math.abs(me.x-s.x)<1.1&&me.z>STALL_FRONT&&me.z<STALL_FRONT+1.6)near=i});
      if(near>=0){const occ=stallOccupant(near);
        if(!occ) setAction("in"+near,[["들어가서 앉기","primary",()=>enterStall(near)]]);
        else setAction("knock"+near,[["똑똑 노크","gold",()=>{act("knock",near);if(occ==="npc")setTimeout(()=>speak("npc-stall","…(인기척)",2400),700)}]]);
      } else if(me.hold) setAction("sip"+sips,[["한 모금","",sip]]); else setAction("",[]);
    }
    if(standingAnim>0)standingAnim=Math.max(0,standingAnim-dt*2);
  }
  // boss
  if(t>bossState.until){
    bossState.s={down:"warn",warn:"up",up:"down"}[bossState.s];
    bossState.until=t+(bossState.s==="warn"?800:bossState.s==="up"?1800+Math.random()*1500:2600+Math.random()*3500);
    if(bossState.s==="up") bossState.caught=false;
    if(bossState.s==="warn") speak("boss","!",800);
  }
  const looking=bossState.s==="up";
  const toMe=Math.atan2(me.x-BOSS.x,me.z-BOSS.z);
  bossC.head.rotation.y+=((looking?Math.max(-1.2,Math.min(1.2,toMe)):-.0)-bossC.head.rotation.y)*Math.min(1,dt*8);
  bossC.head.rotation.x+=((looking?0:.45)-bossC.head.rotation.x)*Math.min(1,dt*8);
  if(looking&&!bossState.caught&&me.where==="walk"&&me.z>-14&&Math.hypot(me.x-BOSS.x,me.z-BOSS.z)<9.5&&me.moving){
    bossState.caught=true;
    if(me.hold){speak("boss",pick(["아 커피 타러 갔었구나~","나도 한 잔 타주지…","믹스야? 좋네."]),2400);speak("me","(커피를 살짝 들어 보인다)",2400);toast("커피 알리바이 성공! 의심도 그대로")}
    else{sus=Math.min(100,sus+15);
    speak("boss",pick(["어디 가?","저기… 음?","회의 몇 시였지?"]),2200); speak("me","(가볍게 목례) 아 네~ 잠깐 어디 좀…",2600);
    toast("팀장님과 눈이 마주쳤다! 의심도 +15")}
  }
  $("sus-top").style.width=sus+"%";
  // my chibi
  meC.g.position.set(me.x,me.where==="desk"?.02:0,me.z);
  meC.g.rotation.y=me.h;
  pose(meC,me.where==="desk"?"sit":me.moving?"walk":"stand",t/1000,dt);
  if(me.where==="desk"){meC.g.position.y=-.02}
  // peers
  for(const id in peers){const o=peers[id],q=o.q;
    const tx=q.x,tz=q.z; const moved=Math.hypot(tx-o.x,tz-o.z);
    o.x+=(tx-o.x)*Math.min(1,dt*8);o.z+=(tz-o.z)*Math.min(1,dt*8);
    o.h+=angDiff(q.h||0,o.h)*Math.min(1,dt*8);
    o.c.g.position.set(o.x,0,o.z);o.c.g.rotation.y=o.h;
    pose(o.c,o.where==="desk"?"sit":moved>.03?"walk":"stand",t/1000,dt); if(o.hold&&o.where!=="desk")o.c.arms[1].rotation.x=-.95}
  // npcs
  npcs.forEach(n=>pose(n.c,"sit",t/1000,dt));
  if(t>npcNext){npcNext=t+6000+Math.random()*9000;const n=pick(npcs);speak("npc"+n.i,pick(NPC_LINES),3800)}
  // stall doors
  STALLS.forEach(s=>{const target=s.open?-1.25:0;s.piv.rotation.y+=(target-s.piv.rotation.y)*Math.min(1,dt*6);
    if(s.shake>0){s.shake-=dt;s.piv.position.z=STALL_FRONT+Math.sin(s.shake*60)*.03}else s.piv.position.z=STALL_FRONT});
  lamps.forEach((l,i)=>l.scale.y=1.3+Math.sin(t/600+i)*.04);
  if(blowing&&me.where==="walk"&&me.x>25){
    blowAcc+=dt*9;while(blowAcc>=1){blowAcc--;spawnBubble(me.x,1.25,me.z,me.h+(Math.random()-.5)*.5)}
    if(t-lastBlowSend>450){lastBlowSend=t;presence({act:{k:"bub",x:+me.x.toFixed(2),z:+me.z.toFixed(2),h:+me.h.toFixed(2),at:Date.now()}})}
    meC.arms[1].rotation.x=-2.5;meC.arms[1].rotation.z=-.5;
  } else if(meC){meC.arms[1].rotation.z=.18;
    if(me.hold&&me.where!=="stall"){meC.arms[1].rotation.x=performance.now()<sipUntil?-2.3:-.95}}
  updateBubbles(dt,t/1000);
  updateCamera(dt);
  renderer.render(scene,camera);
  drawLabels();
  requestAnimationFrame(frame);
}
function drawLabels(){
  for(const el of labelEls.values()) el.dataset.seen="";
  const now=performance.now();
  if(me.where!=="stall") placeLabel(label("tme","tagl me","나"),meC.g,me.where==="desk"?1.75:1.8);
  for(const id in peers){const o=peers[id];if(o.where==="stall")continue;placeLabel(label("t"+id,"tagl","동료"),o.c.g,o.where==="desk"?1.75:1.8)}
  for(const k in bubbles){const b=bubbles[k];if(now>b.until){delete bubbles[k];continue}
    let obj=null,y=2.15,cls="bub";
    if(k==="me"){if(me.where==="stall"){toast(b.text);delete bubbles[k];continue}else obj=meC.g}
    else if(k==="boss"){obj=bossC.g;y=2.0;cls="bub boss"}
    else if(k==="npc-stall"){obj={position:new THREE.Vector3(STALLS[NPC_STALL].x,0,STALL_FRONT)};y=2.5}
    else if(k.startsWith("npc")){const n=npcs[+k.slice(3)];obj=n&&n.c.g}
    else if(peers[k]){const o=peers[k];obj=o.where==="stall"?{position:new THREE.Vector3(STALLS[o.q.stall]?.x||0,0,STALL_FRONT)}:o.c.g}
    if(obj) placeLabel(label("b"+k,cls,b.text),obj,y);
  }
  for(const [k,el] of labelEls) if(!el.dataset.seen){el.remove();labelEls.delete(k)}
}

/* ================= boot ================= */
function resize(){const r=$("stage").getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
function boot(){
  if(!THREEOK){$("loading").textContent="3D를 불러오지 못했어요. 새로고침해 주세요.";return}
  renderer=new THREE.WebGLRenderer({canvas:$("gl"),antialias:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
  camera=new THREE.PerspectiveCamera(55,1,.1,120);
  buildWorld();
  meC=chibi({shirt:me.shirt,shoe:SHOES[me.shoe].c});
  bossC=chibi({shirt:"#2f3a52",tie:"#8e2f2c",hair:"#555"});bossC.g.position.set(BOSS.x,0,BOSS.z);pose(bossC,"sit",0,0);bossC.g.position.y=-.02;
  NPC_DESKS.forEach((di,i)=>{const s=deskSeat(di);const c=chibi({shirt:pick(SHIRTS),shoe:pick(Object.values(SHOES)).c,hair:pick(["#1a1512","#3a2a1e","#2b2b2b"])});c.g.position.set(s.x,-.02,s.z);c.g.rotation.y=Math.PI;npcs.push({c,i,di})});
  const s=deskSeat(me.desk);me.x=s.x;me.z=s.z;
  camera.position.set(s.x+1.0,2.75,s.z+1.6);
  resize(); addEventListener("resize",resize);
  shoeChips(); showLog(); $("desk-h").textContent=pick(DESK_LINES); setCards(); refreshStalls(); updateCounts();
  $("loading").remove();
  requestAnimationFrame(frame);
  connect();
}
/* 같이 있기: claude.ai 안에서는 room 기능, 직접 배포하면 /ws 웹소켓 */
function getRoom(){
  if(window.claude&&window.claude.use) return Promise.resolve(window.claude.use("room")).catch(()=>null);
  if(/^https?:$/.test(location.protocol)&&window.HAEUSO_WS!==false) return Promise.resolve(wsRoom());
  return Promise.resolve(null);
}
function wsRoom(){
  let ws=null, myId=null, mine={}, map=new Map(), handlers=[], pend=null, sendT=0, retry=500, snap=[];
  const url=(location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws";
  const mk=(id,presence)=>({peer:id,by:null,isMe:id===myId,sameTab:id===myId,kind:"viewer",guest:false,presence:presence||{},updatedAt:Date.now()});
  const rebuild=()=>{snap=[...map.values()]};
  const fire=(joined=[],left=[],updated=[])=>{rebuild();const ch={peers:snap,joined,left,updated};handlers.forEach(h=>{try{h(ch)}catch(e){}})};
  function flush(){sendT=0;if(ws&&ws.readyState===1&&pend){ws.send(JSON.stringify({t:"p",p:pend}));pend=null}}
  function open(){
    try{ws=new WebSocket(url)}catch(e){return}
    ws.onopen=()=>{retry=500;pend=Object.assign({},mine);flush()};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
      if(m.t==="hello"){myId=m.id;const old=new Set(map.keys());map.clear();map.set(myId,mk(myId,mine));
        const joined=[map.get(myId)];for(const q of m.peers){const o=mk(q.id,q.p);map.set(q.id,o);joined.push(o)}
        const left=[...old].filter(id=>!map.has(id)).map(id=>mk(id,{}));fire(joined,left,[])}
      else if(m.t==="j"){if(m.id===myId)return;const o=mk(m.id,m.p);map.set(m.id,o);fire([o],[],[])}
      else if(m.t==="l"){const o=map.get(m.id);if(!o)return;map.delete(m.id);fire([],[o],[])}
      else if(m.t==="u"){if(m.id===myId)return;const prev=map.get(m.id);const o=mk(m.id,Object.assign({},prev?prev.presence:{},m.p));for(const k in m.p)if(m.p[k]===null)delete o.presence[k];map.set(m.id,o);fire(prev?[]:[o],[],prev?[o]:[])}
    };
    ws.onclose=()=>{ws=null;setTimeout(open,retry);retry=Math.min(8000,retry*2)};
    ws.onerror=()=>{try{ws.close()}catch(e){}};
  }
  open();
  return{
    presence(patch){Object.assign(mine,patch);for(const k in patch)if(patch[k]===null)delete mine[k];
      if(myId&&map.has(myId))map.set(myId,mk(myId,mine));
      pend=Object.assign(pend||{},patch);if(!sendT)sendT=setTimeout(flush,70);return Promise.resolve()},
    peers(){return snap},
    onPeers(h){handlers.push(h);setTimeout(()=>{rebuild();h({peers:snap,joined:snap,left:[],updated:[]})},0);return()=>{handlers=handlers.filter(x=>x!==h)}},
    connected(){return !!ws&&ws.readyState===1}
  };
}
function connect(){
  getRoom().then(r=>{
    if(!r) return; room=r;
    presence(fullPresence());
    const settledAt=Date.now()+2500;
    room.onPeers(ch=>{
      for(const p of ch.joined){const a=p.presence&&p.presence.act;if(a)lastAct[p.peer]=a.at}
      if(Date.now()>settledAt){
        const j=ch.joined.filter(p=>p.kind==="viewer"&&!p.sameTab).length, l=ch.left.filter(p=>p.kind==="viewer"&&!p.sameTab).length;
        const n=room.peers().filter(p=>p.kind==="viewer").length;
        if(j) toast(`동료 ${j}명이 출근했어요. 지금 ${n}명`);
        else if(l) toast(`동료 ${l}명이 퇴근했어요. 지금 ${n}명`);
      }
      syncPeers();
      for(const p of ch.updated){const a=p.presence&&p.presence.act;if(!a||p.sameTab||a.at===lastAct[p.peer])continue;lastAct[p.peer]=a.at;onAct(a,false)}
    },()=>{room=null});
    // pick a free desk once others have answered
    setTimeout(()=>{
      if(me.where!=="desk") return;
      const taken=new Set(Object.values(peers).map(o=>o.q.desk));
      if(!taken.has(me.desk)) return;
      const d=PREF.find(i=>!taken.has(i)); if(d==null) return;
      DESKS[me.desk].screen.material.color.set("#8fd0bf"); me.desk=d; sitAtDesk();
    },1800);
  }).catch(()=>{});
}
boot();
</script>
